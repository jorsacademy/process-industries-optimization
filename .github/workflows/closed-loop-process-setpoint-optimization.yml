name: Closed-loop process set-point optimization

on:
  push:
    paths:
      - 'projects/closed-loop-process-setpoint-optimization/**'
      - '.github/workflows/closed-loop-process-setpoint-optimization.yml'
  pull_request:
    paths:
      - 'projects/closed-loop-process-setpoint-optimization/**'
      - '.github/workflows/closed-loop-process-setpoint-optimization.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    defaults:
      run:
        working-directory: projects/closed-loop-process-setpoint-optimization

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/closed-loop-process-setpoint-optimization/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python examples/run_demo.py
